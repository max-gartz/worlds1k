[project]
name = "worlds1k"
version = "0.1.0"
description = "ML research project — Thousand Worlds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.30",
    "av>=17.0.0",
    "datasets>=2.19",
    "numpy>=1.24",
    "pillow>=12.1.1",
    "safetensors>=0.4",
    "torch>=2.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "transformers>=4.40",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "taskipy>=1.14.1",
    "ty>=0.0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worlds1k"]

[tool.taskipy.tasks]
lint = "ruff check . && ty check && bandit -c pyproject.toml -r worlds1k/"
format = "ruff check --fix . && ruff format ."
test = "pytest"
coverage = "pytest --cov --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["worlds1k"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG"]
"worlds1k/model/**" = ["N806", "RUF002", "RUF059"]
"worlds1k/inference/**" = ["F841"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = ["tests/**"]

[tool.bandit]
targets = ["worlds1k"]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access and stream real data",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["worlds1k"]

[tool.coverage.report]
show_missing = true
skip_empty = true
